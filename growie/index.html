<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Growie</title>
  <meta name="description" content="아이의 키와 몸무게를 기록하고 또래 대비 성장 백분위수를 확인하는 앱." />
  <link rel="canonical" href="https://barofam.com/growie/" />
  <link rel="icon" type="image/png" href="icon.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #222;
      line-height: 1.7;
      background: #fff;
      -webkit-text-size-adjust: 100%;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 24px 56px;
      text-align: center;
    }
    img {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
    }
    h1 {
      font-size: 28px;
      margin: 18px 0 14px;
      letter-spacing: -.5px;
    }
    p {
      font-size: 15px;
      margin: 6px 0;
      color: #555;
    }
    p.en { color: #999; font-size: 14px; }
    .links {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #e8eaee;
    }
    .links a { color: #2f9a6d; text-decoration: none; font-size: 14px; }
    .links a:hover { text-decoration: underline; }
    .copyright { margin-top: 24px; color: #aaa; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon.png" alt="Growie" />
    <h1>Growie</h1>

    <p>아이의 키와 몸무게를 기록하고<br />또래 대비 성장 백분위수를 확인하는 앱입니다.</p>
    <p class="en">An app for recording your child's height and weight<br />and checking their growth percentile.</p>

    <div class="links">
      <a href="https://quick-tools.barofam.com/growie/privacy-policy.html">개인정보처리방침 · Privacy Policy</a>
    </div>

    <p class="copyright">&copy; barofam</p>
  </div>
</body>
</html>
