<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>barofam</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f9a6d'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3Eb%3C/text%3E%3C/svg%3E" />
  <script>
    // GitHub Pages는 서버가 없어서, 존재하지 않는 경로는 전부 이 404 페이지로 옵니다.
    // 이걸 이용해 "barofam.com/코드" 형태의 짧은 링크를 목적지로 즉시 이동시키는
    // 라우터로 씁니다. 실제로 없는 페이지면 아래 SHORT_LINKS에 없으니 그냥 평범한
    // 404 안내문이 보입니다.
    //
    // 새 짧은 링크 추가법: 아래 SHORT_LINKS 객체에 "코드": "전체 UTM 링크" 한 줄 추가.
    // 코드는 영어 소문자+숫자 조합 5자리 난수.
    var SHORT_LINKS = {
      "qkxur": "https://barofam.com/grovii/?utm_source=threads&utm_medium=social&utm_campaign=grovii_launch&utm_content=launch_post_1"
    };

    var code = location.pathname.replace(/^\/+|\/+$/g, '');
    var dest = SHORT_LINKS[code];
    if (dest) {
      location.replace(dest);
    }
  </script>
  <style>
    body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; max-width: 480px; margin: 80px auto; padding: 0 20px; color: #333; line-height: 1.6; }
    a { color: #2f9a6d; }
  </style>
</head>
<body>
  <p>페이지를 찾을 수 없어요. <a href="/">barofam.com</a>으로 이동해보세요.</p>
</body>
</html>
