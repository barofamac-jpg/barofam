      if (!isNaN(lo) && !isNaN(hi)) {
        // 백분위 곡선: 가우스 곡선을 그대로 샘플링해서 그리고, 마커는 순위(r)를
        // 0~100 축에 선형으로 놓는다. 곡선과 같은 함수로 y를 구하니 마커가
        // 항상 곡선 위에 정확히 놓인다.
        var baseline = 86, peak = 10, amp = baseline - peak, cx = 160, sigma = 50;
        function curveY(x) { return baseline - amp * Math.exp(-((x - cx) * (x - cx)) / (2 * sigma * sigma)); }
        var pts = [];
        for (var x = 4; x <= 316; x += 8) pts.push(x + ',' + curveY(x).toFixed(1));
        document.getElementById('curve-outline').setAttribute('d', 'M' + pts.join(' L'));

        var mx = 4 + (Math.min(Math.max(r, 1), 99) / 100) * 312;
        var my = curveY(mx);
        var fillPts = ['4,' + baseline];
        for (var x2 = 4; x2 <= mx; x2 += 8) fillPts.push(x2 + ',' + curveY(x2).toFixed(1));
        fillPts.push(mx + ',' + my.toFixed(1));
        fillPts.push(mx + ',' + baseline);
        document.getElementById('curve-fill').setAttribute('d', 'M' + fillPts.join(' L') + ' Z');

        document.getElementById('marker-line').setAttribute('x1', mx);
        document.getElementById('marker-line').setAttribute('x2', mx);
        document.getElementById('marker-line').setAttribute('y1', baseline);
        document.getElementById('marker-line').setAttribute('y2', my);
        document.getElementById('marker-dot').setAttribute('cx', mx);
        document.getElementById('marker-dot').setAttribute('cy', my);
        var lbl = document.getElementById('marker-label');
        lbl.setAttribute('x', Math.min(Math.max(mx, 40), 280));
        lbl.setAttribute('y', Math.max(my - 9, 10));
        lbl.textContent = fmt(L.markerLabel, { h: h.toFixed(1) });

        document.getElementById('axis-lo').textContent = lo.toFixed(1) + 'cm';
        document.getElementById('axis-hi').textContent = hi.toFixed(1) + 'cm';
        document.getElementById('axis-caption').textContent = fmt(L.axisCaption, { ref: refName });
      } else {
        document.getElementById('rank-block').hidden = true;
      }
    } else {
      document.getElementById('card-head') && (document.getElementById('card-head').hidden = true);
      document.querySelector('.card').innerHTML =
        '<h1 style="font-size:18px;font-weight:700;margin:0 0 8px">' + L.fallbackTitle + '</h1>' +
        '<p style="font-size:13px;color:#8A8677;line-height:1.6;margin:0">' + L.fallbackBody + '</p>';
      document.getElementById('t-disclaimer').hidden = true;
    }

    // 스토어 버튼: 공유 링크의 utm_* 를 그대로 이어받아 설치 후에도 "성장 리포트
    // 공유"가 유입 경로로 남게 한다(랜딩페이지와 같은 방식).
    var IOS_URL = 'https://apps.apple.com/app/id6809675819';
    var hasIncomingUTM = qs.has('utm_source') || qs.has('utm_campaign');
    var ref = hasIncomingUTM ? qs.toString() : ('utm_source=grovii_share&utm_medium=share&utm_campaign=growth_report');
    var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.barofam.growie.app&referrer=' + encodeURIComponent(ref);
    var ct = (hasIncomingUTM && (qs.get('utm_campaign') || qs.get('utm_source'))) || 'grovii_share_growth_report';
    var iosHref = IOS_URL + '?ct=' + encodeURIComponent(ct);

    var ua = navigator.userAgent || '';
    var isIOSDevice = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var cta = document.getElementById('cta-button');
    cta.textContent = L.cta;
    cta.href = isIOSDevice ? iosHref : PLAY_URL;

    // preview=1 은 그로비 앱 안 웹뷰(공유 전 미리보기)에서 열렸다는 표시.
    // 이미 앱이 있는 사람이라 설치 유도 버튼/문구가 필요 없어서 숨긴다.
    // 실제로 공유되는 링크에는 이 파라미터가 없어 일반 브라우저에서는
    // 그대로 보인다.
    if (qs.get('preview') === '1') {
      cta.hidden = true;
      document.getElementById('t-promo').hidden = true;
    }
  </script>
</body>
</html>
